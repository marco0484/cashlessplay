<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Cosmic Cashless</title>

  <link rel="stylesheet" href="css/styles.css" />

  <link rel="icon" href="data:," />

</head>

<body>

  <!-- ===================================== -->
  <!-- 🌌 NAVBAR -->
  <!-- ===================================== -->

  <header class="navbar">

    <div class="nav-left">

      <h1>Cashless</h1>

      <span class="subtitle">
        By Cosmic Pass
      </span>

    </div>

    <div class="nav-center">

      <button
        onclick="irMetricas()"
        class="nav-btn"
      >
        📊 Métricas
      </button>

      <button
        onclick="verHistorial()"
        class="nav-btn"
      >
        🧾 Historial
      </button>

    </div>

    <div class="nav-right">

      <div class="usuario-box">

        <span id="usuario-logeado">
          👤 --
        </span>

      </div>

      <button
        onclick="logout()"
        class="logout-btn"
      >
        Salir
      </button>

    </div>

  </header>


  <!-- ===================================== -->
  <!-- 🔄 SELECTOR DE MÓDULO -->
  <!-- ===================================== -->

  <div class="module-switcher">

    <button
      type="button"
      id="btn-modulo-recarga"
      class="module-switch-btn active"
      onclick="mostrarModulo('recarga')"
    >

      <span class="module-switch-icon">
        ↗
      </span>

      <span class="module-switch-text">

        <strong>Recarga</strong>

        <small>
          Agregar saldo
        </small>

      </span>

    </button>


    <button
      type="button"
      id="btn-modulo-venta"
      class="module-switch-btn"
      onclick="mostrarModulo('venta')"
    >

      <span class="module-switch-icon">
        ↙
      </span>

      <span class="module-switch-text">

        <strong>Venta</strong>

        <small>
          Descontar saldo
        </small>

      </span>

    </button>

  </div>


  <!-- ===================================== -->
  <!-- 🌌 CONTENIDO -->
  <!-- ===================================== -->

  <main class="pos-container">


    <!-- ===================================== -->
    <!-- 💳 RECARGA -->
    <!-- ===================================== -->

    <section
      id="modulo-recarga"
      class="panel panel-izq"
    >

      <div class="panel-header">

        <span class="panel-tag">
          MÓDULO
        </span>

        <h2>
          Recargas
        </h2>

        <p>
          Agrega saldo a dispositivos registrados
        </p>

      </div>


      <!-- ===================================== -->
      <!-- 📷 SCANNER RECARGA -->
      <!-- ===================================== -->

      <div class="scanner">

        <button
          class="scan-btn"
          onclick="iniciarScanner('recarga')"
        >
          📷 Escanear QR
        </button>

        <div
          id="reader-recarga"
          class="reader-box"
        ></div>

      </div>


      <!-- ===================================== -->
      <!-- 👤 USUARIO RECARGA -->
      <!-- ===================================== -->

      <div class="input-group">

        <label>
          Usuario
        </label>

        <input
          id="userid-recarga"
          autocomplete="off"
          spellcheck="false"
          placeholder="Escanea dispositivo"
        />

      </div>


      <!-- ===================================== -->
      <!-- ℹ️ INFO RECARGA -->
      <!-- ===================================== -->

      <div
        id="info-recarga"
        class="info-box"
      >

        <div class="info-placeholder">
          Esperando usuario para recarga
        </div>

      </div>


      <!-- ===================================== -->
      <!-- 💸 MONTOS -->
      <!-- ===================================== -->

      <div class="monto-section">

        <label>
          Selecciona un monto
        </label>

        <div class="montos">

          <button onclick="setMonto(100)">
            $100
          </button>

          <button onclick="setMonto(200)">
            $200
          </button>

          <button onclick="setMonto(500)">
            $500
          </button>

          <button onclick="setMonto(1000)">
            $1000
          </button>

        </div>

      </div>


      <!-- ===================================== -->
      <!-- 💵 MONTO EXTRA -->
      <!-- ===================================== -->

      <div class="input-group">

        <label>
          Otro monto
        </label>

        <input
          id="monto-recarga"
          type="number"
          inputmode="numeric"
          placeholder="$0"
        />

      </div>


      <!-- ===================================== -->
      <!-- 💳 ACCIONES RECARGA -->
      <!-- ===================================== -->

      <div class="acciones">

        <button
          class="mp-btn"
          onclick="pagarMercadoPago()"
        >
          💳 Mercado Pago
        </button>

        <button
          class="stripe-btn"
          onclick="pagarStripe()"
        >
          💳 Tarjeta
        </button>

        <button
          id="btn-recarga-efectivo"
          class="manual-btn"
          onclick="recargar()"
        >
          💵 Recargar en efectivo
        </button>

      </div>

    </section>


    <!-- ===================================== -->
    <!-- 🛒 VENTA -->
    <!-- ===================================== -->

    <section
      id="modulo-venta"
      class="panel panel-der"
    >

      <div class="panel-header">

        <span class="panel-tag">
          MÓDULO
        </span>

        <h2>
          Venta
        </h2>

        <p>
          Registra productos y descuenta saldo
        </p>

      </div>


      <!-- ===================================== -->
      <!-- 📷 SCANNER VENTA -->
      <!-- ===================================== -->

      <div class="scanner">

        <button
          class="scan-btn"
          onclick="iniciarScanner('pago')"
        >
          📷 Escanear QR
        </button>

        <div
          id="reader-pago"
          class="reader-box"
        ></div>

      </div>


      <!-- ===================================== -->
      <!-- 👤 USUARIO VENTA -->
      <!-- ===================================== -->

      <div class="input-group">

        <label>
          Usuario
        </label>

        <input
          id="userid-pago"
          autocomplete="off"
          spellcheck="false"
          placeholder="Escanea dispositivo"
        />

      </div>


      <!-- ===================================== -->
      <!-- 💰 INFO VENTA -->
      <!-- ===================================== -->

      <div
        id="info-pago"
        class="info-box"
      >

        <div class="info-placeholder">
          Esperando usuario para venta
        </div>

      </div>

<!-- 🍺 PRODUCTOS  DINAMICO -->
<div class="productos-section">

  <label>
    Productos
  </label>

  <div
    id="productos"
    class="productos"
  >

    <div class="productos-loading">
      Cargando productos...
    </div>

  </div>

</div>

      <!-- ===================================== -->
      <!-- 🛒 CARRITO -->
      <!-- ===================================== -->

      <div class="carrito-section">

        <label>
          Carrito
        </label>

        <div
          id="carrito"
          class="carrito-box"
        ></div>

      </div>


      <!-- ===================================== -->
      <!-- ⚡ CHECKOUT -->
      <!-- ===================================== -->

      <div class="checkout-bar">

        <div
          id="total-box"
          class="total-box"
        >
          Total: $0
        </div>

        <button
          id="btn-cobrar"
          class="pagar-btn"
          onclick="pagar()"
        >
          ⚡ Confirmar venta
        </button>

      </div>


      <!-- ===================================== -->
      <!-- 🗑 ACCIONES SECUNDARIAS -->
      <!-- ===================================== -->

      <div class="acciones-secundarias">

        <button
          onclick="limpiarCarrito()"
          class="clear-btn"
        >
          🗑 Limpiar carrito
        </button>

      </div>


      <!-- ===================================== -->
      <!-- 🔥 QR PAGO -->
      <!-- ===================================== -->

      <div
        id="qr-pago"
        class="qr-box"
      ></div>

    </section>

  </main>


  <!-- ===================================== -->
  <!-- 💳 STRIPE MODAL -->
  <!-- ===================================== -->

  <div
    id="stripe-modal"
    class="stripe-modal"
  >

    <div class="stripe-card">

      <div class="stripe-header">

        <h3>
          💳 Pago con Tarjeta
        </h3>

        <button
          class="stripe-close"
          onclick="cerrarModalStripe()"
        >
          ✕
        </button>

      </div>

      <div
        id="payment-element"
        class="payment-element"
      ></div>

      <button
        class="stripe-pay-btn"
        onclick="confirmarPagoStripe()"
      >
        Pagar ahora
      </button>

    </div>

  </div>


  <!-- ===================================== -->
  <!-- 🚀 FOOTER -->
  <!-- ===================================== -->

  <footer class="footer-credit">
    Desarrollado por <strong>Cosmic Pass</strong> 🚀
  </footer>


  <!-- ===================================== -->
  <!-- 📜 SCRIPTS -->
  <!-- ===================================== -->

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://js.stripe.com/v3/"></script>
  <script src="js/app.js"></script>

</body>

</html>
